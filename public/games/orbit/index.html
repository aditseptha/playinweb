<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Orbit Drift</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #08080f; font-family: ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: absolute; inset: 0; pointer-events: none; padding: 12px 16px; color: #ececf6; display: flex; justify-content: space-between; font-weight: 650; font-variant-numeric: tabular-nums; }
    #overlay {
      position: absolute; inset: 0; display: grid; place-items: center;
      background: rgb(6 6 14 / 0.55); color: #ececf6; text-align: center; cursor: pointer;
    }
    #overlay h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.03em; }
    #overlay p { margin: 0; color: #9a9ab8; }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><span id="score">0</span><span>← → or drag</span></div>
  <div id="overlay"><div><h1>Orbit Drift</h1><p>Dodge the debris · click to start</p></div></div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const overlay = document.getElementById("overlay");
    const scoreEl = document.getElementById("score");
    let W, H, running = false, x, rocks, t0, keys = {}, pointerX = null;

    function resize() {
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = W * devicePixelRatio; canvas.height = H * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    function reset() {
      x = W / 2; rocks = []; t0 = performance.now(); scoreEl.textContent = "0";
    }
    function spawn(dt) {
      if (Math.random() < dt * (0.9 + elapsed() / 40)) {
        rocks.push({ x: Math.random() * W, y: -12, r: 6 + Math.random() * 14, v: 90 + Math.random() * 140 + elapsed() * 4 });
      }
    }
    function elapsed() { return (performance.now() - t0) / 1000; }
    let last = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.04, (now - last) / 1000); last = now;
      ctx.fillStyle = "#08080f"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#141428";
      ctx.beginPath(); ctx.arc(W / 2, H + 80, 140, 0, Math.PI * 2); ctx.fill();
      if (running) {
        let vx = 0;
        if (keys.ArrowLeft || keys.a) vx -= 1;
        if (keys.ArrowRight || keys.d) vx += 1;
        if (pointerX != null) vx = Math.sign(pointerX - x);
        x = Math.max(18, Math.min(W - 18, x + vx * 280 * dt));
        spawn(dt);
        for (const r of rocks) r.y += r.v * dt;
        rocks = rocks.filter(r => r.y < H + 30);
        const py = H - 42;
        for (const r of rocks) {
          if (Math.hypot(r.x - x, r.y - py) < r.r + 12) {
            running = false;
            overlay.classList.remove("hidden");
            overlay.querySelector("p").textContent = `Survived ${Math.floor(elapsed())}s — tap to retry`;
          }
        }
        scoreEl.textContent = String(Math.floor(elapsed() * 10));
      }
      ctx.fillStyle = "oklch(0.78 0.16 18)";
      ctx.beginPath(); ctx.arc(x, H - 42, 12, 0, Math.PI * 2); ctx.fill();
      for (const r of rocks) {
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fillStyle = "oklch(0.7 0.04 80)"; ctx.fill();
      }
    }
    window.addEventListener("keydown", (e) => { keys[e.key] = true; keys[e.key.toLowerCase()] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; keys[e.key.toLowerCase()] = false; });
    canvas.addEventListener("pointerdown", (e) => { pointerX = e.clientX; });
    canvas.addEventListener("pointermove", (e) => { if (pointerX != null) pointerX = e.clientX; });
    window.addEventListener("pointerup", () => { pointerX = null; });
    overlay.addEventListener("click", () => { overlay.classList.add("hidden"); reset(); running = true; });
    window.addEventListener("resize", () => { resize(); if (!running) reset(); });
    resize(); reset(); requestAnimationFrame(loop);
  </script>
</body>
</html>
