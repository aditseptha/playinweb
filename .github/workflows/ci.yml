name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders so the app boots; nothing here talks to the real Supabase project.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, tests, tokens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Route types (LayoutProps, PageProps) come from Next's type generator.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - name: tokens.css matches lib/tokens.ts
        run: npm run tokens:check
      - name: No raw colours in design system code
        run: npm run check:hex
      - name: Email templates match lib/email-templates.ts
        run: npm run emails:check

  design-system:
    name: Design system (axe, keyboard, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload report (screenshots, traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload new screenshot baselines (commit them into e2e/__screenshots__)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-baselines
          path: test-results/baselines
          if-no-files-found: ignore
          retention-days: 14
